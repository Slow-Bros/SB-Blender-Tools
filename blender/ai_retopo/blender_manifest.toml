schema_version = "1.0.0"

id = "ai_retopo"
version = "0.1.0"
name = "AI Retopo"
tagline = "AI retopology via Scenario API, placed on the original object"
maintainer = "Slow Bros. <amalia@slow-bros.com>"
type = "add-on"

website = "https://github.com/Slow-Bros/SBTools"
tags = ["Mesh", "Object"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Upload mesh to api.cloud.scenario.com, download retopo result"
files = "Temporary GLB/OBJ files while exchanging meshes with the API"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
]
